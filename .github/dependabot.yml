version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    rebase-strategy: auto
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /.github/workflows
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    rebase-strategy: auto
    groups:
      github-actions-dependencies:
        patterns:
          - "*"