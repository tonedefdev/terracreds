name: Ubuntu Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: Build and Test Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.26.0
      uses: actions/setup-go@v7
      with:
        go-version: 1.26.0
      id: go
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: |
        mkdir "$HOME/.terraform.d"
        go build .
      env:
        HOME: /home/runner
    - name: Test
      run: |
        export PATH="$PATH:$PWD"
        cd cmd
        go test -v -cover