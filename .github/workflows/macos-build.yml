name: macOS Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mac:
    name: Build and Test macOS
    runs-on: macos-latest
    steps:
    - name: Set up Go 1.26.0
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.0
      id: go
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Build
      run: |
        mkdir /Users/runner/.terraform.d
        go build .
      env:
        HOME: /Users/runner/
    - name: Test
      run: |
        export PATH="$PATH:$PWD"
        cd cmd
        go test -v -cover