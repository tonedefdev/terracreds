name: Windows Build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-win:
    name: Build and Test Windows
    runs-on: windows-latest
    steps:
    - name: Set up Go 1.26.0
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.0
      id: go
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Build
      run: |
        go build .
    - name: Test
      run: |
        New-Item -ItemType Directory -Name terraform.d -Path $env:APPDATA | Out-Null
        $env:HOME=$env:APPDATA
        $env:TC_CONFIG_PATH=$env:APPDATA
        $env:PATH += ";$pwd"
        cd cmd
        go test -v -cover